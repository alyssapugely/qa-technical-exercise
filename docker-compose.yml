# Local development database only, so `npm run setup` works on a clean machine.
services:
  db:
    image: postgres:16-alpine
    container_name: curator-db
    environment:
      POSTGRES_USER: curator
      POSTGRES_PASSWORD: curator
      POSTGRES_DB: curator
    ports:
      - '5433:5432'
    volumes:
      - curator-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U curator -d curator']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  curator-db-data:
